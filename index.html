<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal & Academic Tools</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4318ff;
            --primary-dark: #2b3674;
            --bg-color: #f4f7fe;
            --card-bg: #ffffff;
            --text-color: #2b3674;
            --text-muted: #a3edda;
            --border-radius: 20px;
            --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 1. Countdown Section Styles */
        .countdown-section {
            background: linear-gradient(135deg, #2b3674 0%, #4318ff 100%);
            color: #ffffff;
            padding: 25px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .badge-live {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .countdown-header h2 {
            margin-top: 8px;
            font-size: 22px;
            font-weight: 600;
        }

        .countdown-timer {
            display: flex;
            gap: 12px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 10px 16px;
            border-radius: 12px;
            text-align: center;
            min-width: 60px;
        }

        .time-box span {
            display: block;
            font-size: 24px;
            font-weight: 700;
            line-height: 1;
        }

        .time-box small {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
            display: block;
        }

        /* 2. CGPA Calculator Section Styles */
        .cgpa-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            color: var(--primary-dark);
        }

        .section-header i {
            font-size: 24px;
            color: var(--primary);
        }

        .course-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 40px;
            gap: 12px;
            margin-bottom: 15px;
            align-items: center;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e5f2;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 24, 255, 0.1);
        }

        .btn-remove {
            background: #ff4d4f15;
            color: #ff4d4f;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-remove:hover {
            background: #ff4d4f;
            color: white;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #3311db;
        }

        .btn-secondary {
            background: #f4f7fe;
            color: var(--primary-dark);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #f4f7fe;
            border-radius: 15px;
            text-align: center;
        }

        .result-box h3 {
            font-size: 16px;
            color: #7090b0;
            margin-bottom: 5px;
        }

        .result-box .cgpa-val {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
        }

        /* Responsive Layout */
        @media (max-width: 600px) {
            .countdown-section {
                flex-direction: column;
                align-items: flex-start;
            }
            .countdown-timer {
                width: 100%;
                justify-content: space-between;
            }
            .time-box {
                flex: 1;
                min-width: unset;
                padding: 8px 5px;
            }
            .course-row {
                grid-template-columns: 1fr 1fr 1fr 35px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. LIVE COUNTDOWN SECTION -->
    <section class="countdown-section">
        <div class="countdown-header">
            <span class="badge-live"><i class="fa-solid fa-bell fa-bounce"></i> Upcoming Event</span>
            <h2 id="event-title">পরবর্তী মিড-টার্ম পরীক্ষা</h2>
        </div>
        <div class="countdown-timer">
            <div class="time-box">
                <span id="days">00</span>
                <small>দিন</small>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <small>ঘণ্টা</small>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <small>মিনিট</small>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <small>সেকেন্ড</small>
            </div>
        </div>
    </section>

    <!-- 2. CGPA CALCULATOR SECTION -->
    <section class="cgpa-section">
        <div class="section-header">
            <i class="fa-solid fa-calculator"></i>
            <h2>CGPA ক্যালকুলেটর</h2>
        </div>

        <div id="course-list">
            <!-- Initial Course Rows -->
            <div class="course-row">
                <input type="text" placeholder="কোর্সের নাম (ঐচ্ছিক)">
                <input type="number" class="credit" placeholder="ক্রেডিট" min="0" step="0.5" value="3">
                <select class="grade">
                    <option value="4.00">A+ (4.00)</option>
                    <option value="3.75">A (3.75)</option>
                    <option value="3.50">A- (3.50)</option>
                    <option value="3.25">B+ (3.25)</option>
                    <option value="3.00">B (3.00)</option>
                    <option value="2.75">B- (2.75)</option>
                    <option value="2.50">C+ (2.50)</option>
                    <option value="2.25">C (2.25)</option>
                    <option value="2.00">D (2.00)</option>
                    <option value="0.00">F (0.00)</option>
                </select>
                <button class="btn-remove" onclick="removeRow(this)"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="addCourseRow()"><i class="fa-solid fa-plus"></i> কোর্স যোগ করুন</button>
            <button class="btn btn-primary" onclick="calculateCGPA()"><i class="fa-solid fa-check"></i> সিজিপিএ হিসাব করুন</button>
        </div>

        <div class="result-box">
            <h3>আপনার অর্জিত GPA / CGPA</h3>
            <div class="cgpa-val" id="cgpa-result">0.00</div>
        </div>
    </section>

</div>

<script>
    // ==========================================
    // 1. COUNTDOWN TIMER LOGIC
    // ==========================================
    // এখানে আপনার পরীক্ষার বা অ্যাসাইনমেন্টের নির্দিষ্ট তারিখটি দিন (YYYY-MM-DDTHH:MM:SS)
    const targetDate = new Date("2026-10-15T10:00:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference > 0) {
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? '0' + days : days;
            document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
        } else {
            document.getElementById("event-title").innerText = "ইভেন্টটি সম্পন্ন হয়েছে!";
            document.querySelector(".countdown-timer").style.display = "none";
        }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // ==========================================
    // 2. CGPA CALCULATOR LOGIC
    // ==========================================
    function addCourseRow() {
        const container = document.getElementById('course-list');
        const newRow = document.createElement('div');
        newRow.className = 'course-row';
        newRow.innerHTML = `
            <input type="text" placeholder="কোর্সের নাম (ঐচ্ছিক)">
            <input type="number" class="credit" placeholder="ক্রেডিট" min="0" step="0.5" value="3">
            <select class="grade">
                <option value="4.00">A+ (4.00)</option>
                <option value="3.75">A (3.75)</option>
                <option value="3.50">A- (3.50)</option>
                <option value="3.25">B+ (3.25)</option>
                <option value="3.00">B (3.00)</option>
                <option value="2.75">B- (2.75)</option>
                <option value="2.50">C+ (2.50)</option>
                <option value="2.25">C (2.25)</option>
                <option value="2.00">D (2.00)</option>
                <option value="0.00">F (0.00)</option>
            </select>
            <button class="btn-remove" onclick="removeRow(this)"><i class="fa-solid fa-trash"></i></button>
        `;
        container.appendChild(newRow);
    }

    function removeRow(button) {
        const rows = document.querySelectorAll('.course-row');
        if (rows.length > 1) {
            button.parentElement.remove();
        } else {
            alert('কমপক্ষে একটি কোর্স থাকতে হবে!');
        }
    }

    function calculateCGPA() {
        const credits = document.querySelectorAll('.credit');
        const grades = document.querySelectorAll('.grade');
        
        let totalCredits = 0;
        let totalPoints = 0;

        for (let i = 0; i < credits.length; i++) {
            const creditVal = parseFloat(credits[i].value);
            const gradeVal = parseFloat(grades[i].value);

            if (!isNaN(creditVal) && creditVal > 0) {
                totalCredits += creditVal;
                totalPoints += (creditVal * gradeVal);
            }
        }

        if (totalCredits > 0) {
            const cgpa = (totalPoints / totalCredits).toFixed(2);
            document.getElementById('cgpa-result').innerText = cgpa;
        } else {
            document.getElementById('cgpa-result').innerText = '0.00';
        }
    }
</script>

</body>
</html>
